    TerminationReason:
      # Deliberately not an enum: generated SDKs type enums as closed unions,
      # which would make every future reason a breaking change for clients.
      # Keep the known values in sync with ClassifyTerminationReason.
      type: string
      description: |-
        Machine-readable reason the instance was terminated. Always present once
        state is "terminated", never present before that. New values may be added
        over time, so treat any unrecognized value as "Unknown". Known values:
        - "UserRequested": terminated by a delete request to the API.
        - "InactivityTimeout": the timeout given in spec.inactivityTimeout elapsed.
        - "HardTimeout": the timeout given in spec.hardTimeout elapsed.
        - "Unknown": terminated for a cause the platform did not attribute,
          including instances that failed to get ready during creation. See
          errorMessage for details when available.
      example: InactivityTimeout
