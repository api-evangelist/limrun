openapi: "3.0.0"
info:
  version: 1.0.0
  title: Limrun API
paths:
  /v1/analytics/private:
    get:
      summary: Get analytics across all organizations
      operationId: getPrivateAnalytics
      parameters:
        - name: from
          description: Start of the time range (inclusive, RFC3339)
          required: true
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          description: End of the time range (exclusive, RFC3339)
          required: true
          in: query
          schema:
            type: string
            format: date-time
        - name: region
          description: Optional region filter
          required: false
          in: query
          schema:
            type: string
        - name: bucket
          description: Time bucket granularity for the analytics series
          required: false
          in: query
          schema:
            type: string
            enum: [hour, day, week, minute]
            default: day
        - name: timezone
          description: Optional IANA timezone used for time bucket grouping. Defaults to America/Los_Angeles when omitted.
          required: false
          in: query
          schema:
            type: string
            default: America/Los_Angeles
        - name: labels
          description: Label selector to filter instances (e.g., "env=prod,team=backend")
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/analytics:
    get:
      summary: Get analytics for the authenticated organization
      operationId: getAnalytics
      parameters:
        - name: from
          description: Start of the time range (inclusive, RFC3339)
          required: true
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          description: End of the time range (exclusive, RFC3339)
          required: true
          in: query
          schema:
            type: string
            format: date-time
        - name: region
          description: Optional region filter
          required: false
          in: query
          schema:
            type: string
        - name: bucket
          description: Time bucket granularity for the analytics series
          required: false
          in: query
          schema:
            type: string
            enum: [hour, day, week, minute]
            default: day
        - name: timezone
          description: Optional IANA timezone used for time bucket grouping. Defaults to America/Los_Angeles when omitted.
          required: false
          in: query
          schema:
            type: string
            default: America/Los_Angeles
        - name: labels
          description: Label selector to filter instances (e.g., "env=prod,team=backend")
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/analytics/instances:
    get:
      summary: Get per-instance analytics for the authenticated organization
      description: Returns per-instance analytics grouped by minute bucket for detailed chart views.
      operationId: getAnalyticsInstances
      parameters:
        - name: from
          description: Start of the time range (inclusive, RFC3339)
          required: true
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          description: End of the time range (exclusive, RFC3339)
          required: true
          in: query
          schema:
            type: string
            format: date-time
        - name: region
          description: Optional region filter
          required: false
          in: query
          schema:
            type: string
        - name: timezone
          description: Optional IANA timezone used for minute bucket grouping. Defaults to America/Los_Angeles when omitted.
          required: false
          in: query
          schema:
            type: string
            default: America/Los_Angeles
        - name: labels
          description: Label selector to filter instances (e.g., "env=prod,team=backend")
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsInstancesResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/android_instances:
    get:
      summary: List Android instances
      operationId: listAndroidInstancesV1
      parameters:
        - name: region
          description: Region where the instance is scheduled on.
          required: false
          in: query
          schema:
            type: string
        - name: state
          description: |
            State filter to apply to Android instances to return. Each comma-separated state will be used as part of
            an OR clause, e.g. "assigned,ready" will return all instances that are either assigned or ready.

            Valid states: creating, assigned, ready, terminated, unknown
          required: false
          in: query
          schema:
            type: string
            example: "assigned,ready"
        - name: labelSelector
          description: |
            Labels filter to apply to Android instances to return.
            Expects a comma-separated list of key=value pairs (e.g., env=prod,region=us-west).
          required: false
          in: query
          schema:
            type: string
            example: "env=prod,version=1.2"
        - name: limit
          description: |
            Maximum number of instances to be returned. The default is 50.
          in: query
          schema:
            type: integer
            example: 50
            default: 50
        - name: startingAfter
          in: query
          schema:
            type: string
        - name: endingBefore
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AndroidInstance"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
    post:
      summary: Create an Android instance
      operationId: createAndroidInstanceV1
      parameters:
        - name: wait
          description: Return after the instance is ready to connect.
          required: false
          in: query
          schema:
            type: boolean
        - name: reuseIfExists
          description: |
            If there is another instance with given labels and region, return that one instead of creating
            a new instance.
          required: false
          in: query
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AndroidInstanceCreate"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AndroidInstance"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/android_instances/{id}:
    get:
      summary: Get Android instance with given ID
      operationId: getAndroidInstanceV1
      parameters:
        - name: id
          description: Android instance ID, e.g. android_someid
          required: true
          in: path
          schema:
