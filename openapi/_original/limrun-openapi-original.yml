        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
    delete:
      summary: Delete Android instance with given name
      operationId: deleteAndroidInstanceV1
      parameters:
        - name: id
          description: Android instance ID, e.g. android_someid
          required: true
          in: path
          schema:
