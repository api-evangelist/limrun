notes: >-
  The harvested OpenAPI declares only 200 and a `default` response per operation, so the status-code
  catalog cannot be derived from the spec. It is taken instead from the SDK reference error table,
  which enumerates the HTTP statuses and the typed error class each maps to in every SDK. Limrun
  returns plain JSON errors, not application/problem+json, so there are no RFC 9457 `type` URIs.
envelope:
