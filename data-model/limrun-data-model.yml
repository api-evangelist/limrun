summary: >-
  Limrun's data model is Kubernetes-shaped. Four instance families (iOS, Android, Xcode, Gradle) share
  an identical metadata / spec / status envelope and an identical five-verb CRUD surface. Assets are a
  separate, instance-independent binary store that instances reference at boot. Analytics is a
  read-only reporting projection over terminated and running instances. There are no foreign-key
  fields between instance families - the graph is composition (an instance embeds its own spec and
  status) plus reference-by-value from spec.initialAssets into the Asset store.
