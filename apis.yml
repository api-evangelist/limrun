aid: limrun
name: Limrun
description: >-
  Limrun (Limrun, Inc.) is a Y Combinator-backed cloud infrastructure company for mobile development,
  built so cloud coding agents and Linux CI runners can build, run, and test iOS and Android apps
  without a Mac. Limrun exposes three composable cloud services behind one REST control plane at
  api.limrun.com: iOS simulators running on real Macs (streamable in a browser and drivable
  programmatically through taps, screenshots, accessibility element trees, video recording, and app
  lifecycle), remote Xcode and Bazel build sandboxes that accept synced sources and run xcodebuild or
  remote build execution, and accelerated Android emulators reachable over an ADB tunnel by Android
  Studio, Appium, or scrcpy. Gradle build sandboxes and a managed Asset Storage service for .apk and
  .app build artifacts round out the platform. Every instance is created through the control plane
  with an org API key and returns its own per-instance token, data-plane URLs, a signed browser
  stream URL, and its own Model Context Protocol server, which makes Limrun one of the few providers
  shipping a per-instance MCP endpoint alongside first-party Agent Skills for coding agents.
