instance_lifecycle:
  note: >-
    Distinct from API lifecycle - this is the runtime state machine every iOS, Android, Xcode, and
    Gradle instance moves through.
  states:
  - state: unknown
    meaning: Default placeholder; should not be returned for live instances.
  - state: creating
    meaning: Provisioning. URLs in status are not yet populated.
  - state: assigned
    meaning: Hardware has been assigned; instance is booting.
  - state: ready
    meaning: Fully booted. All URLs populated. Safe to connect a control client.
  - state: terminated
    meaning: >-
      Stopped by explicit delete, inactivity timeout, hard timeout, or error. status.errorMessage is
      set on the error path.
  transitions: creating -> assigned -> ready -> terminated; creating -> error -> terminated
  termination_causes:
  - explicit delete
  - inactivity timeout
  - hard timeout
  - error
